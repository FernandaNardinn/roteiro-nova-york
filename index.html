<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1F3D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roteirei">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Roteirei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Questrial&display=swap" rel="stylesheet">
<style>
:root{
  /* Um tema só, claro: branco, cinza claro e burgundy. Burgundy sempre como fundo com texto branco com texto escuro, nunca como cor de texto. */
  /* Layout: uma aba por dia; cada parada mostra só o essencial, o resto abre ao tocar */
  --bg:#F3F4F6;        /* cinza claro */
  --surface:#FFFFFF;   /* branco */
  --ink:#111827;       /* texto: 17:1 no branco */
  --muted:#4B5563;     /* texto secundário: 7.5:1 no branco */
  --line:#E5E7EB;
  --yellow:#7A1F3D;    /* burgundy: fundo com texto branco, contraste ~11:1 */
  --on-accent:#FFFFFF;
  --yellow-soft:#F8ECF0;
  --yellow-edge:#7A1F3D;
  --font:"Questrial","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fun:"Syne","Segoe UI",Helvetica,Arial,sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--ink);text-decoration-thickness:1.5px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* Cabeçalho */
header{padding:32px 0 16px}
.dates{display:inline-block;background:var(--yellow);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:8px 8px;border-radius:999px}
h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:16px 0 8px;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:52ch}

/* Abas */
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px;max-width:680px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1 var(--font);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;text-decoration:none}
.tab small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-bottom:0}
.tab[aria-current="page"]{background:var(--yellow);border-color:var(--yellow-edge)}
.tab[aria-current="page"] small{color:var(--ink)}
.tab.extra{background:transparent}

/* Dia */
.view{padding:8px 0 48px}
.dayhead{margin:16px 0 32px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h2{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.015em;margin:8px 0 8px;text-wrap:balance}
.sum{margin:0;color:var(--muted);max-width:52ch}
.note{display:inline-flex;gap:8px;align-items:center;margin-top:16px;background:var(--yellow-soft);border:1px solid var(--yellow-edge);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600}

/* Timeline */
.tl{display:grid;gap:16px}
.stop{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:56px 1fr;gap:8px 16px;box-shadow:0 1px 2px rgba(17,24,39,.05)}
.stop.key{box-shadow:inset 4px 0 0 var(--yellow-edge),0 1px 2px rgba(17,24,39,.05)}
.time{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;padding-top:0}
.body{min-width:0;display:grid;gap:16px}
h3{font-size:18px;line-height:1.3;font-weight:700;margin:0}
.what{margin:-8px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--yellow);border-color:var(--yellow-edge)}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.facts{display:grid;gap:8px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.go{display:grid;gap:8px;font-size:15px;border-top:0 solid var(--line);padding-top:16px}
.go .lbl,.more summary{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tip{background:var(--yellow-soft);border-radius:12px;padding:16px 16px;font-size:15px}
.more summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;min-height:32px}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-size:16px;color:var(--ink)}
.more[open] summary::after{content:"–"}
.more ul{margin:8px 0 0;padding-left:16px;display:grid;gap:8px}
.ln{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font:700 12px/1 Helvetica,Arial,sans-serif;color:#fff;vertical-align:-5px;margin:0 0}
.l-ace{background:#0039A6}.l-g{background:#4B8B2B}.l-l{background:#6D6E71}.l-jz{background:#8A5A2B}.l-nqrw{background:#FCCC0A;color:#111}.l-123{background:#D52B1E}.l-bdfm{background:#E2551B}.l-7{background:#B933AD}

/* Comer */
.eat{margin-top:40px}
.eat h3{font-size:20px;margin-bottom:16px}
.foods{background:var(--surface);border-radius:var(--r);overflow:hidden}
.food{display:grid;grid-template-columns:1fr auto;gap:0 16px;padding:16px 16px;border-bottom:0 solid var(--line)}
.food:last-child{border-bottom:0}
.food strong{font-size:16px}
.food .price{font-size:13px;font-weight:700;background:var(--bg);border-radius:999px;padding:0 8px;align-self:start;white-space:nowrap}
.food p{grid-column:1/-1;margin:0;color:var(--muted);font-size:14px}
.food .actions{grid-column:1/-1;margin-top:8px}

/* Listas extras */
.card{background:var(--surface);border-radius:var(--r);padding:8px 16px}
.check{list-style:none;margin:0;padding:0}
.check li{border-bottom:0 solid var(--line)}
.check li:last-child{border-bottom:0}
.check label{display:grid;grid-template-columns:24px 1fr;gap:16px;padding:16px 0;cursor:pointer}
.check input{width:22px;height:22px;margin:0 0 0;accent-color:#111827}
.check b{display:block}
.check span span{color:var(--muted);font-size:14px}
.check input:checked + span b{text-decoration:line-through;color:var(--muted)}
.tips{list-style:none;margin:0;padding:0}
.tips li{padding:16px 0;border-bottom:0 solid var(--line)}
.tips li:last-child{border-bottom:0}
.tips b{display:block;margin-bottom:0}
.tips span{color:var(--muted);font-size:15px}
.contact{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:0 solid var(--line)}
.contact:last-child{border-bottom:0}
.hostel{margin-top:16px;background:var(--surface);border-radius:var(--r);padding:16px 16px;display:grid;gap:8px}
.hostel strong{font-size:16px}
.hostel span{color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:13px;padding:0 0 48px;max-width:52ch}
@media (max-width:400px){.stop{grid-template-columns:1fr;padding:16px}.time{padding:0}h1{font-size:30px}}

/* Versão leve: lista única por dia, cada linha abre ao tocar */
header{padding:32px 0 8px}
h1{font-size:28px;margin:8px 0 0}
.dayhead{margin:8px 0 16px}
h2{font-size:24px}
.sum{font-size:15px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
details.row{border-bottom:0 solid var(--line)}
details.row:last-child{border-bottom:0}
details.row>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px 1fr 20px;gap:16px;align-items:center;padding:16px 16px;min-height:64px}
details.row>summary::-webkit-details-marker{display:none}
details.row>summary .t{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
details.row>summary .n{font-weight:600;font-size:16px;line-height:1.3}
details.row>summary .n small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:0}
details.row>summary .chev{width:20px;height:20px;transition:transform .15s}
details.row[open]>summary .chev{transform:rotate(180deg)}
details.row.key>summary .t{background:var(--yellow);color:var(--ink);border-radius:8px;padding:8px 0;text-align:center}
.inner{padding:0 16px 16px 88px;display:grid;gap:16px}
.inner p{margin:0;color:var(--muted);font-size:15px}
.inner ul{margin:0;padding-left:16px;display:grid;gap:8px;font-size:15px}
.inner .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:0}
.inner .go{border:0;padding:0}
.eat{margin-top:32px}
.eat h3{font-size:16px;font-weight:700;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.price{font-size:12px;font-weight:700;background:var(--bg);border-radius:999px;padding:0 8px;white-space:nowrap;margin-left:8px;vertical-align:1px}
.note{margin-top:16px;font-size:13px;padding:8px 8px}
@media (max-width:400px){.inner{padding:0 16px 16px 16px}details.row>summary{grid-template-columns:46px 1fr 20px;gap:16px;padding:16px}}
@media (prefers-reduced-motion:reduce){details.row>summary .chev{transition:none}}
details.row.eatrow>summary{grid-template-columns:1fr 20px}
details.row.eatrow .inner{padding-left:16px}

/* Mobile */
html{-webkit-tap-highlight-color:transparent}
body{padding-bottom:env(safe-area-inset-bottom)}
.tab{min-height:48px;padding:8px 16px}
.btn{min-height:48px}
.btn small{font-weight:500;color:var(--muted);margin-left:0}
.near{display:grid;gap:0;border-top:0 solid var(--line);padding-top:16px}
.nearitem{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:48px;padding:8px 0;border-bottom:0 solid var(--line);text-decoration:none;font-weight:600;font-size:15px}
.nearitem:last-child{border-bottom:0}
.nearitem small{font-weight:500;color:var(--muted);font-size:13px;text-align:right}
.rec{background:var(--yellow-soft);border-radius:12px;padding:8px 16px;font-size:15px}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .tabs{padding:0 16px}
  .inner{padding:0 16px 16px 16px}
  details.row>summary{grid-template-columns:48px 1fr 20px;gap:16px;padding:16px;min-height:64px}
  details.row.eatrow>summary{grid-template-columns:1fr 20px}
  details.row.eatrow .inner{padding-left:16px}
  h1{font-size:26px} h2{font-size:22px}
}

/* Swipe entre dias */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px}
.pager a{display:flex;flex-direction:column;gap:0;min-height:56px;justify-content:center;padding:8px 16px;border-radius:var(--r);background:var(--surface);text-decoration:none;font-weight:700;font-size:15px}
.pager a small{font-weight:500;font-size:12px;color:var(--muted)}
.pager a.next{text-align:right;grid-column:2}
.pager a.next.solo{grid-column:2}
.swipehint{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
@media (prefers-reduced-motion:no-preference){
  .view.in-left{animation:inL .22s ease-out}
  .view.in-right{animation:inR .22s ease-out}
  @keyframes inL{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes inR{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
}
.view{touch-action:pan-y}

/* Fonte divertida */
h1,h2,.time,details.row>summary .t,.dates,.tab,.menu a,.eat h3,.eyebrow{font-family:var(--fun)}
h1{font-weight:700;letter-spacing:0}
h2{font-weight:600;letter-spacing:0}
.eyebrow,.eat h3{letter-spacing:.04em;font-weight:600}
details.row>summary .n{font-weight:700}
.tab{font-weight:600}
/* Menu inferior */
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.menu{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--surface);border-top:0 solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(17,24,39,.06)}
.menu a{display:flex;flex-direction:column;align-items:center;gap:0;min-height:56px;justify-content:center;border-radius:14px;text-decoration:none;font-size:13px;font-weight:600;color:var(--muted)}
.menu a svg{width:22px;height:22px}
.menu a[aria-current="page"]{background:var(--yellow);color:var(--ink)}
@media (min-width:700px){.menu{left:50%;right:auto;transform:translateX(-50%);width:520px;bottom:16px;border:1px solid var(--line);border-radius:20px;padding:8px}}
.daytabs[hidden]{display:none}
/* Reservar e contatos mais leves */
.progress{display:flex;align-items:center;gap:16px;margin-top:16px;font-weight:700;font-size:14px}
.bar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow-edge);border-radius:999px;transition:width .2s}
.ccard{background:var(--surface);border-radius:var(--r);padding:16px 16px;display:grid;gap:8px}
.ccard+.ccard{margin-top:16px}
.ccard strong{font-family:var(--fun);font-weight:600;font-size:17px}
.ccard p{margin:0;color:var(--muted);font-size:14px}
.ccard.sos{background:var(--yellow-soft);border:1px solid var(--yellow-edge)}

/* Títulos: Vanity se estiver instalada; senão Josefin Sans, a alternativa grátis mais parecida */
h1,h2{font-weight:700;letter-spacing:.01em;text-transform:none}
h1{font-size:32px}
.time,details.row>summary .t,.tab,.menu a,.dates{font-weight:700}
.eyebrow,.eat h3{font-weight:600;letter-spacing:.08em}

/* Texto branco sobre o burgundy */
.dates,.btn.primary,.tab[aria-current="page"],.tab[aria-current="page"] small,.menu a[aria-current="page"],details.row.key>summary .t{color:var(--on-accent)}
.btn.primary svg{stroke:var(--on-accent)}
.note{color:var(--yellow)}
.check input{accent-color:#7A1F3D}

/* Syne + DM Sans e ajustes de acessibilidade */
h1,h2,h3,.eat h3,.ccard strong{font-family:var(--fun);font-weight:700;letter-spacing:-.01em}
h1{font-weight:800;font-size:32px;line-height:1.1}
h2{font-size:24px;line-height:1.2}
.tab,.menu a,.dates,.time,details.row>summary .t,.eyebrow,.eat h3{font-family:var(--fun)}
details.row>summary .n{font-family:var(--font);font-weight:600}
body{font-size:16px;line-height:1.5}
.eyebrow,.eat h3,.inner .lbl,.go .lbl,.more summary{font-size:14px}
.tab small,.menu a{font-size:14px}
details.row>summary .n small,.facts,.food .price,.progress,.ccard p,.check span span,.nearitem small,footer{font-size:14px}
.skip{position:absolute;left:16px;top:-80px;z-index:20;background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-weight:700}
.skip:focus{top:16px}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.tab[aria-current="page"],.menu a[aria-current="page"]{font-weight:700}
h2:focus{outline:none}
@media (forced-colors:active){.tab[aria-current="page"],.menu a[aria-current="page"],.btn.primary{border:2px solid CanvasText}}

/* Tenor Sans nos títulos (tem um peso só: sem negrito falso). Rótulos pequenos ficam em DM Sans para ler bem. */
h1,h2,h3,.eat h3,.ccard strong{font-family:var(--fun);font-weight:400;font-synthesis:none;letter-spacing:0}
h1{font-size:40px;line-height:1.05}
h2{font-size:32px;line-height:1.15}
.eat h3{font-family:var(--font);font-weight:700;letter-spacing:.06em;font-size:14px}
.ccard strong{font-size:22px}
.tab,.menu a,.dates,.time,details.row>summary .t,.eyebrow{font-family:var(--font);font-weight:600}
.tab[aria-current="page"],.menu a[aria-current="page"],.time,details.row>summary .t{font-weight:700}
@media (max-width:560px){h1{font-size:36px}h2{font-size:28px}}

/* Tenor Sans: um peso só, então nada de negrito falso */
h1,h2,.ccard strong{font-family:var(--fun);font-weight:400;font-synthesis:none}
h1{font-size:36px;line-height:1.15;letter-spacing:-.01em}
h2{font-size:28px;line-height:1.2}
h3{font-family:var(--font);font-weight:700}
.ccard strong{font-size:20px}
@media (max-width:560px){h1{font-size:32px}h2{font-size:24px}}

/* Karla no corpo: tamanhos padrão de leitura no celular */
body{font-size:16px;line-height:1.55}
details.row>summary .n{font-size:17px}
.eyebrow,.eat h3,.inner .lbl,.go .lbl,.more summary,.tab small,.menu a,details.row>summary .n small,.facts,.food .price,.progress,.ccard p,.check span span,.nearitem small,footer{font-size:14px}
.inner p,.inner ul,.tip,.rec,.go,.tips span{font-size:16px}
.btn,.tab{font-size:15px}
.time,details.row>summary .t{font-size:16px;font-variant-numeric:tabular-nums}
/* Syne: títulos em 700–800, corpo em 400 (regular) */
body{font-weight:400}
h1,h2,.ccard strong{font-family:var(--fun);font-synthesis:none;letter-spacing:-.01em}
h1{font-weight:800;font-size:32px;line-height:1.1}
h2{font-weight:700;font-size:24px;line-height:1.2}
.ccard strong{font-weight:700;font-size:18px}
@media (max-width:560px){h1{font-size:30px}h2{font-size:22px}}

/* Questrial só tem peso regular: o corpo fica em Questrial e tudo que precisa de destaque (negrito) usa Syne, sem negrito falso */
body{font-family:var(--font);font-weight:400}
b,strong,.tab,.menu a,.dates,.time,details.row>summary .t,details.row>summary .n,.eyebrow,.eat h3,.inner .lbl,.go .lbl,.btn,.food .price,.progress,.check b,.tips b,.nearitem span,.note,.skip,.rec .lbl{font-family:var(--fun)}
details.row>summary .n small,.nearitem small{font-family:var(--font);font-weight:400}

/* Containers: respiro consistente (grade de 8) e conteúdo aberto agrupado */
header{padding:32px 0 16px}
h1{margin:0}
.view{padding:16px 0 48px}
.dayhead{margin:8px 0 24px}
.dayhead .note{margin-top:16px}
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.row{border-bottom:1px solid var(--line)}
details.row:last-child{border-bottom:0}
details.row>summary{padding:16px;min-height:64px;gap:16px}
details.row[open]{background:#FAFAFB}
details.row[open]>summary{padding-bottom:8px}
.inner{padding:8px 16px 24px 80px;display:grid;gap:16px}
.inner>*{margin:0}
.inner .facts,.inner p{line-height:1.6}
.inner .actions{gap:8px}
.inner .go,.inner .near{border-top:1px solid var(--line);padding-top:16px}
.tip,.rec{padding:16px;border-radius:12px}
.nearitem{min-height:48px;padding:0}
details.row.eatrow>summary{padding:16px}
details.row.eatrow .inner{padding:8px 16px 24px 16px}
.eat{margin-top:40px}
.eat h3{margin:0 0 16px}
.card{padding:0 24px;border:1px solid var(--line)}
.ccard{padding:24px;gap:16px;border:1px solid var(--line)}
.ccard+.ccard{margin-top:16px}
.ccard .actions{margin-top:0}
.check label{padding:16px 0;gap:16px}
.tips li{padding:16px 0}
@media (max-width:560px){.inner{padding:8px 16px 24px 16px}}

/* Horários centralizados na coluna da timeline */
details.row>summary .t{display:flex;align-items:center;justify-content:center;text-align:center;min-height:32px;padding:0;border-radius:8px}

/* Coluna de horário larga o bastante para a Syne, com respiro dentro da pill */
details.row>summary{grid-template-columns:72px 1fr 24px}
details.row.eatrow>summary{grid-template-columns:1fr 24px}
details.row>summary .t{width:100%;box-sizing:border-box;padding:0 8px;white-space:nowrap;font-size:15px;letter-spacing:0}
.inner{padding-left:104px}
@media (max-width:560px){
  details.row>summary{grid-template-columns:72px 1fr 24px}
  details.row.eatrow>summary{grid-template-columns:1fr 24px}
  .inner,details.row.eatrow .inner{padding-left:16px}
}

/* "Dia X · ..." mais visível: burgundy e mais peso */
.eyebrow{color:var(--yellow);font-weight:700;font-size:15px;letter-spacing:.06em}
.daynote{margin-top:16px}

/* Mais respiro no topo e ao redor do título */
header.wrap{padding-top:calc(32px + env(safe-area-inset-top));padding-bottom:24px}

/* Só centraliza o número embaixo do nome do dia; espaçamentos iguais */
.tab{text-align:center}

/* Status em tempo real (horário de Nova York): agora = burgundy, já passou = cinza */
details.row>summary .t{background:transparent;color:var(--ink)}
details.row.key>summary .t{background:transparent;color:var(--ink)}
details.row.is-now>summary .t{background:var(--yellow);color:var(--on-accent)}
details.row.is-now{box-shadow:inset 4px 0 0 var(--yellow)}
details.row.is-past>summary .t,details.row.is-past>summary .n{color:#6B7280}
details.row.is-past>summary .n{font-weight:500}
.now-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* CTA de ingresso: único botão preenchido em burgundy, largura total */
.cta{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 16px;border-radius:12px;background:var(--yellow);color:var(--on-accent);font-family:var(--fun);font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.cta svg{width:20px;height:20px;flex:0 0 auto}
.cta span:first-of-type{flex:1}
.cta:active{transform:translateY(1px);box-shadow:none}
.checklink{display:inline-flex;align-items:center;min-height:32px;margin-top:8px;font-family:var(--fun);font-weight:700;font-size:14px;color:var(--yellow)}

.cta .ext{width:18px;height:18px;flex:0 0 auto;color:var(--on-accent)}
.checklink{gap:8px}
.checklink .ext{width:16px;height:16px}

/* Itens abertos viram um bloco próprio, com respiro branco em volta, para não se misturarem */
.list{padding:0}
details.row[open]{margin:8px;border:1px solid var(--line);border-radius:12px;background:#F7F7F9;box-shadow:none}
details.row[open]+details.row{border-top:0}
details.row:has(+ details.row[open]){border-bottom:0}
details.row.is-now[open]{box-shadow:inset 4px 0 0 var(--yellow)}
details.row[open]>summary{padding:16px 8px 8px}
details.row[open] .inner{padding:8px 8px 24px}
@media (min-width:561px){details.row[open] .inner{padding-left:96px}}
details.row.eatrow[open]>summary{padding:16px 8px 8px}
details.row.eatrow[open] .inner{padding:8px 8px 24px}

/* Botões secundários (Mapa, Domino Park, telefone) em branco com borda, para destacar sobre o fundo cinza */
.btn:not(.primary){background:var(--surface);border:1px solid #D1D5DB}
.btn:not(.primary):active{background:#F3F4F6}

/* Ícone do meio de transporte: traço branco simples num círculo burgundy */
.golbl{display:flex;align-items:center;gap:8px}
.modeicon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--yellow);color:var(--on-accent);flex:0 0 auto}
.modeicon svg{width:18px;height:18px}

/* Correções de alinhamento */
.inner .go .golbl{display:flex;align-items:center;gap:8px;margin:0 0 8px;line-height:1}
.inner .go{display:block}
.inner .go>span:last-child{display:block;line-height:1.7}
.ln{vertical-align:middle;position:relative;top:-2px;margin:0 4px}
details.row[open] .inner{padding-bottom:16px}
.inner .near{padding-bottom:0}
.inner .tip{line-height:1.5}

details.row[open]>summary,details.row.eatrow[open]>summary{padding:16px 16px 8px}
details.row[open] .inner,details.row.eatrow[open] .inner{padding:8px 16px 16px}
@media (min-width:561px){details.row[open] .inner{padding-left:104px}}

/* Comer perto: cartões brancos com distância e o que pedir */
.inner .near{display:grid;gap:8px}
.nearcard{display:grid;gap:8px;padding:16px;background:var(--surface);border:1px solid #D1D5DB;border-radius:12px;text-decoration:none;color:var(--ink)}
.nc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nc-name{font-family:var(--fun);font-weight:700;font-size:16px}
.nc-price{font-size:14px;color:var(--muted);white-space:nowrap}
.nc-walk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.nc-walk svg{width:16px;height:16px;flex:0 0 auto}
.nc-rec{background:var(--yellow-soft);border-radius:8px;padding:8px 16px;font-size:15px;line-height:1.5}
.nc-rec b{font-family:var(--fun);color:var(--yellow)}

/* Modo edição */
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.titlerow h2{flex:1}
.editbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid #D1D5DB;background:var(--surface);color:var(--ink);font:700 14px/1 var(--fun);cursor:pointer;flex:0 0 auto;margin-top:8px}
.editbtn svg{width:16px;height:16px}
.editbtn.on{background:var(--yellow);border-color:var(--yellow);color:var(--on-accent)}
.savenote{margin:8px 0 0;font-size:14px;color:var(--muted);min-height:24px}
.empty{padding:24px 16px;margin:0;color:var(--muted)}
.elist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.erow{background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:pan-y}
.erow.dragging{position:relative;z-index:5;box-shadow:0 8px 24px rgba(17,24,39,.18);border-color:var(--yellow)}
body.is-dragging{user-select:none;-webkit-user-select:none}
.ehead{display:grid;grid-template-columns:48px 56px 1fr auto;align-items:center;gap:8px;padding:8px 16px 8px 0}
.handle{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--muted);cursor:grab;touch-action:none;border-radius:8px}
.handle:active{cursor:grabbing}
.handle svg{width:22px;height:22px}
.et{font-family:var(--fun);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.en{font-family:var(--fun);font-weight:700;font-size:15px;line-height:1.3;min-width:0}
.en small{display:block;font-family:var(--font);font-weight:400;font-size:14px;color:var(--muted);margin-top:4px}
.warn{color:#B42318;font-weight:600}
.btn.small{min-height:40px;padding:8px 16px;font-size:14px}
.btn.danger{color:#B42318;border-color:#F0B4AE}
.btn[disabled]{opacity:.4}
.epanel{display:grid;gap:16px;padding:8px 16px 16px;border-top:1px solid var(--line)}
.epanel label,.addform label{display:grid;gap:8px;font-family:var(--fun);font-weight:700;font-size:14px}
.epanel input,.epanel select,.epanel textarea,.addform input,.addform select,.addform textarea{font:16px/1.4 var(--font);color:var(--ink);background:var(--surface);border:1px solid #C4C9D2;border-radius:8px;padding:8px 16px;min-height:48px;width:100%}
.epanel textarea,.addform textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hint{margin:-8px 0 0;font-size:14px;color:var(--muted)}
.eactions{display:flex;flex-wrap:wrap;gap:8px}
.addbtn{margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border:2px dashed #C4C9D2;border-radius:12px;background:transparent;color:var(--ink);font:700 16px var(--fun);cursor:pointer}
.addbtn svg{width:20px;height:20px}
.addform{margin-top:16px;display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px 16px}
.addform h3{margin:0;font-family:var(--fun);font-size:18px}
.addform .cta{border:0;cursor:pointer}
.xlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.xrow{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 16px;font-family:var(--fun);font-weight:700;font-size:15px}
.xrow .btn svg,.btn.small svg{width:16px;height:16px}
@media (max-width:400px){.ehead{grid-template-columns:48px 48px 1fr auto}.two{grid-template-columns:1fr}}
.startlbl{display:flex;align-items:center;gap:16px;margin-top:16px;font-family:var(--fun);font-weight:700;font-size:14px}
.startlbl input{font:16px var(--font);min-height:48px;padding:8px 16px;border:1px solid #C4C9D2;border-radius:8px;background:var(--surface);color:var(--ink)}

.xmaslist{display:grid;gap:16px}
.xcard .xday{display:inline-block;justify-self:start;background:var(--yellow-soft);color:var(--yellow);border-radius:999px;padding:0 8px;font:700 14px/32px var(--fun)}
.xcard ul{margin:0;padding-left:24px;display:grid;gap:8px;font-size:15px}
.xcard .xfacts,.xcard .xgo{font-size:14px;line-height:1.6}

/* Ícone de atividade de Natal */
.tree{width:22px;height:22px;margin-right:8px;vertical-align:-5px;flex:0 0 auto}
details.row.is-past .tree{filter:grayscale(1);opacity:.7}

.check li{display:flex;align-items:flex-start;gap:8px}
.check li label{flex:1}
.check .rdel{margin-top:16px;flex:0 0 auto}
#resform{margin-top:16px}

/* Reservar: CTA que abre o formulário e caixinhas brancas */
.resadd{margin-top:16px;width:100%;justify-content:center;border:0;cursor:pointer}
.resadd span:first-of-type{flex:0 0 auto}
.check input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin:0;border:2px solid #9CA3AF;border-radius:6px;background:#FFFFFF;display:grid;place-content:center;cursor:pointer;flex:0 0 auto}
.check input[type="checkbox"]:checked{background:var(--yellow);border-color:var(--yellow)}
.check input[type="checkbox"]:checked::after{content:"";width:12px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-2px) rotate(-45deg)}
.check input[type="checkbox"]:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.check label>span{display:grid;gap:4px}
.check .checklink{display:inline-flex;width:fit-content;margin-top:4px}
.daynote{border-radius:12px;display:block;line-height:1.5;padding:8px 16px}
</style>
</head>

  if(li.nextElementSibling!==before) list.insertBefore(li,before);
  const natural=li.getBoundingClientRect().top;
  li.style.transform=`translateY(${e.clientY-DRAG.offset-natural}px)`;
  if(e.clientY<90) window.scrollBy(0,-8); else if(e.clientY>window.innerHeight-130) window.scrollBy(0,8);
});
function endDrag(){
  if(!DRAG) return; const {li,list}=DRAG; const dayId=curDayId();
  li.style.transform=""; li.classList.remove("dragging"); document.body.classList.remove("is-dragging");
  const order=[...list.children].map(x=>x.dataset.id);
  const map=Object.fromEntries(PLAN[dayId].map(x=>[x.id,x]));
  const next=order.map(id=>map[id]).filter(Boolean);
  const changed=next.some((x,i)=>x!==PLAN[dayId][i]);
  DRAG=null;
  if(changed){PLAN[dayId]=next; saveDay(dayId);}
  rerender();
}
view.addEventListener("pointerup",endDrag); view.addEventListener("pointercancel",endDrag);
view.addEventListener("keydown",e=>{
  const h=e.target.closest&&e.target.closest(".handle"); if(!h) return;
  if(e.key!=="ArrowUp"&&e.key!=="ArrowDown") return; e.preventDefault();
  const dayId=curDayId(), id=h.closest(".erow").dataset.id, list=PLAN[dayId], i=findIdx(dayId,id), j=e.key==="ArrowUp"?i-1:i+1;
  if(j<0||j>=list.length) return; [list[i],list[j]]=[list[j],list[i]]; saveDay(dayId); rerender();
  const nh=view.querySelector(`.erow[data-id="${CSS.escape(id)}"] .handle`); if(nh) nh.focus();
});



/* ===== Reservar: itens fixos + tarefas novas da Rafa ===== */
let RES={custom:[],done:{}};
CHECK.forEach(([t],i)=>{ if(saved[i]) RES.done["b:"+t]=true; }); /* migra marcações antigas (por posição) */
try{const r=JSON.parse(localStorage.getItem("ny-res")||"null"); if(r) RES=sanitizeRes(r)||RES;}catch(e){}
function sanitizeRes(r){
  if(!r||typeof r!=="object") return null;
  const custom=Array.isArray(r.custom)?r.custom.filter(x=>x&&typeof x.id==="string"&&typeof x.t==="string").slice(0,100).map(x=>({id:x.id.slice(0,40),t:x.t.slice(0,140),w:typeof x.w==="string"?x.w.slice(0,300):""})):[];
  const done={}; if(r.done&&typeof r.done==="object") Object.keys(r.done).slice(0,300).forEach(k=>{if(r.done[k]===true) done[k.slice(0,200)]=true});
  return {custom,done};
}
function resItems(){return [...CHECK.map(([t,w])=>({k:"b:"+t,t,w,link:CHECKLINK[t]})),...RES.custom.map(c=>({k:"c:"+c.id,t:c.t,w:c.w,custom:c.id}))]}
function resHTML(){
  const items=resItems(), done=items.filter(i=>RES.done[i.k]).length;
  return `<div class="dayhead"><div class="eyebrow">Antes de viajar</div><h2>O que reservar e fazer</h2>
   <div class="progress"><span>${done} de ${items.length}</span><div class="bar"><i style="width:${items.length?Math.round(done/items.length*100):0}%"></i></div></div></div>
   <div class="card"><ul class="check">${items.map((it,i)=>`<li><label for="r${i}"><input type="checkbox" id="r${i}" data-rk="${esc(it.k)}" ${RES.done[it.k]?"checked":""}><span><b>${esc(it.t)}</b>${it.w?`<span>${esc(it.w)}</span>`:""}${it.link?`<a class="checklink" href="${it.link}" rel="noopener">Abrir site${EXT}</a>`:""}</span></label>${it.custom?`<button type="button" class="btn small danger rdel" data-rdel="${esc(it.custom)}" aria-label="Excluir ${esc(it.t)}">Excluir</button>`:""}</li>`).join("")}</ul></div>
   ${RES_ADDING?`<form class="addform" id="resform">
     <h3>Nova tarefa</h3>
     <label>O que fazer<input type="text" name="t" required maxlength="140" placeholder="Ex.: Comprar adaptador de tomada"></label>
     <label>Detalhe (opcional)<input type="text" name="w" maxlength="300" placeholder="Ex.: tomada tipo A/B dos EUA"></label>
     <div class="eactions"><button type="submit" class="cta">${PLUS}<span>Adicionar</span></button><button type="button" class="btn" data-resact="cancel">Cancelar</button></div>
   </form>`:`<button type="button" class="cta resadd" data-resact="open">${PLUS}<span>Adicionar à lista</span></button>`}
   ${RES_NOTE?`<p class="savenote" role="status">${esc(RES_NOTE)}</p>`:""}`;
}
let RES_NOTE="",RES_ADDING=false;
function updateResProgress(){const items=resItems(),done=items.filter(i=>RES.done[i.k]).length;const p=view.querySelector(".progress");if(p){p.querySelector("span").textContent=`${done} de ${items.length}`;p.querySelector(".bar i").style.width=(items.length?Math.round(done/items.length*100):0)+"%";}}
let resTimer=null,resWriting=false,resPending=false;
function saveRes(){
  try{localStorage.setItem("ny-res",JSON.stringify(RES))}catch(e){}
  if(!DB){RES_NOTE="Salvo neste celular.";return}
  clearTimeout(resTimer); resTimer=setTimeout(writeRes,500);
}
async function writeRes(){
  if(resWriting){resPending=true;return} resWriting=true;
  try{await DB.doc("lists/reservas").set({custom:RES.custom,done:RES.done,v:1});RES_NOTE="Salvo. Aparece igual em qualquer aparelho."}
  catch(e){RES_NOTE="Não deu para salvar online. Ficou salvo neste celular."}
  resWriting=false; const n=view.querySelector(".savenote"); if(n) n.textContent=RES_NOTE;
  if(resPending){resPending=false;writeRes()}
}
view.addEventListener("submit",e=>{
  if(e.target.id!=="resform") return; e.preventDefault();
  const fd=new FormData(e.target), t=(fd.get("t")||"").toString().trim(); if(!t) return;
  RES.custom.push({id:"t"+Date.now().toString(36),t:t.slice(0,140),w:(fd.get("w")||"").toString().trim().slice(0,300)});
  RES_ADDING=false; saveRes(); view.innerHTML=resHTML(); const nb=view.querySelector('[data-resact="open"]'); if(nb) nb.focus();
});
view.addEventListener("click",e=>{
  const ra=e.target.closest("[data-resact]");
  if(ra){RES_ADDING=ra.dataset.resact==="open";view.innerHTML=resHTML();if(RES_ADDING){const f=view.querySelector('#resform input[name="t"]');if(f)f.focus();}else{const nb=view.querySelector('[data-resact="open"]');if(nb)nb.focus();}return}
  const b=e.target.closest("[data-rdel]"); if(!b) return;
  const id=b.dataset.rdel; RES.custom=RES.custom.filter(c=>c.id!==id); delete RES.done["c:"+id];
  saveRes(); view.innerHTML=resHTML();
});
(async()=>{
  try{ if(!window.claude||!window.claude.use) return; const db=await window.claude.use("db"); if(!db) return;
    db.doc("lists/reservas").onSnapshot(snap=>{
      if(!snap.exists||resWriting||resTimer&&resPending) return;
      const r=sanitizeRes(snap.data()); if(!r) return;
      if(JSON.stringify(r)!==JSON.stringify(RES)){RES=r;try{localStorage.setItem("ny-res",JSON.stringify(RES))}catch(e){} if(curId==="reservas"&&!view.contains(document.activeElement&&document.activeElement.closest("#resform"))) view.innerHTML=resHTML();}
    },()=>{});
  }catch(e){}
})();


/* ===== Contatos: fixos + novos ===== */
let CONS=[],CON_ADDING=false,CON_NOTE="";
try{const c=JSON.parse(localStorage.getItem("ny-contacts")||"null");if(Array.isArray(c))CONS=sanitizeCons(c)}catch(e){}
function sanitizeCons(arr){return (Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.id==="string"&&typeof x.n==="string").slice(0,100).map(x=>({id:x.id.slice(0,40),n:x.n.slice(0,100),p:typeof x.p==="string"?x.p.replace(/[^\d+()\- ]/g,"").slice(0,30):"",a:typeof x.a==="string"?x.a.slice(0,200):"",d:typeof x.d==="string"?x.d.slice(0,200):""}))}
const telAny=p=>{const digits=p.replace(/[^\d+]/g,"");const href=digits.startsWith("+")?digits:(digits.length===10?"+1"+digits:digits);return `<a class="btn" href="tel:${href}" aria-label="Ligar para ${esc(p)}">${PHONE}${esc(p)}</a>`};
function contactsHTML(){
  return `<div class="dayhead"><div class="eyebrow">Guarde no celular</div><h2>Contatos</h2></div>
   <div class="ccard sos"><strong>Emergência</strong><p>Polícia, bombeiros e ambulância</p><div class="actions"><a class="btn primary" href="tel:911">${PHONE}911</a></div></div>
   ${CONTACTS.filter(([n])=>!n.startsWith("Emergência")).map(([n,p])=>{const c=CONTACT_INFO[n]||{};return `<div class="ccard"><strong>${esc(n)}</strong>${c.d?`<p>${esc(c.d)}</p>`:""}<div class="actions">${telBtn(p)}${c.a?mapBtn(c.a,"Mapa",false):""}</div></div>`}).join("")}
   ${CONS.map(c=>`<div class="ccard"><strong>${esc(c.n)}</strong>${c.d?`<p>${esc(c.d)}</p>`:""}<div class="actions">${c.p?telAny(c.p):""}${c.a?mapBtn(c.a,"Mapa",false):""}<button type="button" class="btn small danger" data-cdel="${esc(c.id)}" aria-label="Excluir ${esc(c.n)}">Excluir</button></div></div>`).join("")}
   ${CON_ADDING?`<form class="addform" id="conform">
     <h3>Novo contato</h3>
     <label>Nome<input type="text" name="n" required maxlength="100" placeholder="Ex.: Restaurante, amigo, hotel"></label>
     <label>Telefone (opcional)<input type="tel" name="p" maxlength="30" placeholder="Ex.: (212) 555-0123"></label>
     <label>Endereço (opcional)<input type="text" name="a" maxlength="200"></label>
     <label>Observação (opcional)<input type="text" name="d" maxlength="200" placeholder="Ex.: reserva sex 27, 20h"></label>
     <div class="eactions"><button type="submit" class="cta">${PLUS}<span>Adicionar</span></button><button type="button" class="btn" data-conact="cancel">Cancelar</button></div>
   </form>`:`<button type="button" class="cta resadd" data-conact="open">${PLUS}<span>Adicionar contato</span></button>`}
   ${CON_NOTE?`<p class="savenote" role="status">${esc(CON_NOTE)}</p>`:""}`;
}
let conTimer=null,conWriting=false,conPending=false;
function saveCons(){
  try{localStorage.setItem("ny-contacts",JSON.stringify(CONS))}catch(e){}
  if(!DB){CON_NOTE="Salvo neste celular.";return}
  clearTimeout(conTimer); conTimer=setTimeout(writeCons,400);
}
async function writeCons(){
  if(conWriting){conPending=true;return} conWriting=true;
  try{await DB.doc("lists/contatos").set({items:CONS,v:1});CON_NOTE="Salvo. Aparece igual em qualquer aparelho."}catch(e){CON_NOTE="Não deu para salvar online. Ficou salvo neste celular."}
  conWriting=false; const n=view.querySelector(".savenote"); if(n&&curId==="contatos") n.textContent=CON_NOTE;
  if(conPending){conPending=false;writeCons()}
}
view.addEventListener("click",e=>{
  const ca=e.target.closest("[data-conact]");
  if(ca){CON_ADDING=ca.dataset.conact==="open";view.innerHTML=contactsHTML();const f=view.querySelector(CON_ADDING?'#conform input[name="n"]':'[data-conact="open"]');if(f)f.focus();return}
  const d=e.target.closest("[data-cdel]"); if(!d) return;
  CONS=CONS.filter(c=>c.id!==d.dataset.cdel); saveCons(); view.innerHTML=contactsHTML();
});
view.addEventListener("submit",e=>{
  if(e.target.id!=="conform") return; e.preventDefault();
  const fd=new FormData(e.target), n=(fd.get("n")||"").toString().trim(); if(!n) return;
  CONS.push(...sanitizeCons([{id:"k"+Date.now().toString(36),n,p:(fd.get("p")||"").toString(),a:(fd.get("a")||"").toString().trim(),d:(fd.get("d")||"").toString().trim()}]));
  CON_ADDING=false; saveCons(); view.innerHTML=contactsHTML(); const nb=view.querySelector('[data-conact="open"]'); if(nb) nb.focus();
});
(async()=>{
  try{ if(!window.claude||!window.claude.use) return; const db=await window.claude.use("db"); if(!db) return;
    db.doc("lists/contatos").onSnapshot(snap=>{
      if(!snap.exists||conWriting||conTimer&&conPending) return;
      const d=snap.data(); const c=sanitizeCons(d&&d.items);
      if(JSON.stringify(c)!==JSON.stringify(CONS)){CONS=c;try{localStorage.setItem("ny-contacts",JSON.stringify(CONS))}catch(e){} if(curId==="contatos"&&!CON_ADDING) view.innerHTML=contactsHTML();}
    },()=>{});
  }catch(e){}
})();

show();
</script>
